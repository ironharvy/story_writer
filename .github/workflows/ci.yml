name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check .

      - name: Pylint (design smells)
        run: pylint --fail-under=8.0 main.py core/foundation.py generators/baseline.py generators/world_state.py generators/dspy_module.py

      - name: Radon (cyclomatic complexity)
        run: radon cc . -s -n C --exclude ".venv/*,archive/*" --no-assert

      - name: Vulture (dead code)
        run: vulture . --min-confidence 80 --exclude .venv,archive

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          set +e
          pytest -q --ignore=archive
          code=$?
          # exit code 5 = no tests collected; treat as success until a test suite exists
          if [ $code -eq 5 ]; then exit 0; fi
          exit $code
